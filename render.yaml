databases:
  - name: vyapaarpilot-db
    databaseName: vyapaarpilot1
    user: vyapaaradmin
    plan: free
    region: oregon # or frankfurt, singapore, ohio

services:
  - type: web
    name: vyapaarpilot-backend
    runtime: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vyapaarpilot-db
          property: connectionString
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: STT_PROVIDER
        value: groq
      - key: TTS_PROVIDER
        value: assemblyai
      - key: CORS_ORIGINS
        value: "*"
